# Marca de juancib.ar (sistema de diseño «juancib.ar», tema Papel)
color:
  palette:
    papel: "#FBFAF7"
    papel-hundido: "#F1EFE8"
    tinta: "#1E2430"
    tinta-media: "#475063"
    mar: "#1F5A7A"
    frontera: "#A8433A"
    linea: "#D8D3C7"
  background: papel
  foreground: tinta
  primary: mar
  danger: frontera
  light: papel-hundido

typography:
  fonts:
    - family: Archivo
      source: google
      weight: [400, 600, 700]
    - family: Archivo Narrow
      source: google
      weight: [500, 600]
    - family: Source Serif 4
      source: google
      weight: [400, 600]
      style: [normal, italic]
    - family: JetBrains Mono
      source: google
      weight: [400, 500]
  base:
    family: Source Serif 4
    size: 18px
    line-height: 1.65
  headings:
    family: Archivo
    weight: 600
  monospace: JetBrains Mono
  link:
    color: mar
