project:
  type: website
  output-dir: _site
  # La portada solo publica estas páginas. Lo demás (proyectos/, publicaciones.qmd,
  # notas .md) queda en el repo sin renderizarse hasta que se borre o se mueva.
  render:
    - index.qmd
    - cv.qmd
  resources:
    - CNAME
    - "files/*.pdf"

lang: es

# El código R se ejecuta sólo en local; el CI (sin R) usa los resultados de _freeze/
execute:
  freeze: auto

website:
  title: "Juan Cib"
  site-url: "https://juancib.ar"
  navbar:
    left:
      - href: https://blog.juancib.ar
        text: Blog
      - href: cv.qmd
        text: CV
  page-footer:
    center: |
      [Mail](mailto:jpcibantos@gmail.com) ·
      [GitHub](https://github.com/jpcib) ·
      [LinkedIn](https://www.linkedin.com/in/juan-cibantos/)

format:
  html:
    theme: cosmo
    toc: false
